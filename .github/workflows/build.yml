name: Build
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'
    - name: Build
      run: swift build
    - name: Run tests
      run: swift test

  build-linux:
    runs-on: ubuntu-latest
    container: swift:6.1-jammy
    steps:
    - uses: actions/checkout@v4
    - name: Install SQLite
      run: apt-get update && apt-get install -y libsqlite3-dev
    - name: Build
      run: swift build
    - name: Run tests
      run: swift test
